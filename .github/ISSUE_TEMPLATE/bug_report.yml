name: Bug report
description: Something the plugin does wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste your Emet key, session content or transcripts. Security issues go through private reporting; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of /emet:status
      description: It shows ids, counts and statuses only.
      render: text
  - type: input
    id: versions
    attributes:
      label: Plugin version, Claude Code version, operating system
      placeholder: 0.1.0, 2.1.294, macOS 26
    validations:
      required: true
