name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag matches every version and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          test "$(jq -r .version claude/.claude-plugin/plugin.json)" = "$version"
          test "$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)" = "$version"
          grep -qx "VERSION = \"$version\"" claude/scripts/emet_claude/__init__.py
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Extract the changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
